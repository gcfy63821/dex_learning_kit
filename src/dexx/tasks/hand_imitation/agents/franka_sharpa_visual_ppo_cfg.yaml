seed: 42
algo: PPOVisual  # Use PPOVisual algorithm for visual observations
device: cuda
network:
  mlp:
    units: [256, 512, 128, 64]
  priv_mlp:
    units: [256, 128, 40]
  # Enable visual (CNN) processing
  use_visual: True
  # CNN encoder configuration for depth images
  visual:
    depth_height: 256 #48  # Depth image height
    depth_width: 256 #64  # Depth image width
    cnn_units: [64, 128, 32]  # Feature channels for each conv layer
    cnn_feature_dim: 32  # Final feature dimension after CNN processing

load_path: None # path to the checkpoint to load

algorithm:
  experiment_name: 'franka_sharpa_visual'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 4096
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 2e-4
  kl_threshold: 0.008
  # PPO batch collection
  horizon_length: 32
  minibatch_size: 1024
  mini_epochs: 5
  # PPO loss setting
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  # grad clipping
  truncate_grads: True
  grad_norm: 1.0
  # snapshot setting
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 5500000000
  # hora setting
  priv_info: True
  priv_info_dim: 40
  priv_info_embed_dim: 40

