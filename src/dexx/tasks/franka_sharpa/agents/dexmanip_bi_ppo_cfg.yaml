seed: 42
algo: PPO
device: cuda
network:
  mlp:
    units: [256, 512, 128, 64]
  priv_mlp:
    units: [256, 128, 80]
  # ── 分臂网络开关 ──
  # 优先级:bimanual_split > asymmetric_ac > (default symmetric)
  bimanual_split: true          # ← 打开分臂
  asymmetric_ac: false          # ← 关掉(被 bimanual_split 覆盖)

  # 可选:显式指定每侧维度(不填就自动 total/2)
  # side_obs_dim: 550
  # side_action_dim: 29
  side_priv_dim: 148

load_path: None

algorithm:
  experiment_name: 'dexmanip_bimanual_force_split'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 4096
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 2e-4
  kl_threshold: 0.008
  horizon_length: 32
  minibatch_size: 1024
  mini_epochs: 5
  clip_value: True
  critic_coef: 2
  entropy_coef: 0.0001
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 5500000000

  # 双手维度
  priv_info: True
  priv_info_dim: 296
  priv_info_embed_dim: 296

  # 不用 teacher
  teacher_path: None
  teacher_proprio_adapt: False
  teacher_network:
    mlp:
      units: [256, 512, 128, 64]
    priv_mlp:
      units: [256, 128, 80]
  student_proprio_adapt: False
  teacher_loss_weight: 1.0
  reward_loss_weight: 0.1
  temperature: 3.0
  use_value_distill: False
